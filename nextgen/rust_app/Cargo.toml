[package]
name = "observatory_core"
version = "0.1.0"
edition = "2021"
authors = ["Celestia project"]
license = "GPL-3.0-or-later"

[lib]
name = "observatory_core"
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
glam = "0.29"
pollster = "0.4"
wgpu = "0.19"
winit = "0.29"
